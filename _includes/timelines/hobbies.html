    <style>
        /* Cooking tile — clickable, animated, unique */
        .cooking-link {
            display: block;
            position: relative;
            text-decoration: none !important;
            color: inherit !important;
            overflow: hidden;
        }

        /* Shimmer sweep — dark diagonal band */
        .cooking-link::before {
            content: '';
            position: absolute;
            top: 0; left: -80%;
            width: 60%; height: 100%;
            background: linear-gradient(
                120deg,
                rgba(0,0,0,0) 0%,
                rgba(0,0,0,0.22) 50%,
                rgba(0,0,0,0) 100%
            );
            transform: skewX(-20deg);
            animation: cookingShimmer 3.5s ease-in-out infinite;
            pointer-events: none;
            z-index: 3;
        }

        @keyframes cookingShimmer {
            0%   { left: -80%; opacity: 0; }
            10%  { opacity: 1; }
            60%  { left: 130%; opacity: 1; }
            61%  { opacity: 0; }
            100% { left: 130%; opacity: 0; }
        }

        /* Pulsing dark border */
        .cooking-link::after {
            content: '';
            position: absolute;
            inset: 0;
            animation: cookingGlow 2.8s ease-in-out infinite;
            pointer-events: none;
            z-index: 3;
        }

        @keyframes cookingGlow {
            0%, 100% {
                border: 3px solid rgba(15, 15, 25, 0.5);
                box-shadow: inset 0 0 25px rgba(10,10,20,0.3), 0 0 20px rgba(10,10,20,0.4);
            }
            50% {
                border: 3px solid rgba(15, 15, 25, 0.95);
                box-shadow: inset 0 0 50px rgba(10,10,20,0.55), 0 0 40px rgba(10,10,20,0.75);
            }
        }

        /* Explore badge */
        .cooking-badge {
            position: absolute;
            top: 22px; right: 24px;
            background: rgba(15, 15, 25, 0.88);
            color: #e8e8e8;
            font-family: 'Source Sans Pro', sans-serif;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            padding: 6px 16px;
            border-radius: 24px;
            border: 1px solid rgba(255,255,255,0.15);
            z-index: 4;
            box-shadow: 0 4px 16px rgba(0,0,0,0.5);
            animation: badgeBounce 2.8s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes badgeBounce {
            0%, 100% { transform: translateY(0px); }
            50%       { transform: translateY(-5px); }
        }

        /* Hover: scale + darken overlay */
        .cooking-link:hover .callout.cooking {
            filter: brightness(0.9) contrast(1.05);
            transform: scaleY(1.03);
            transition: filter 0.35s ease, transform 0.35s ease;
        }
        .callout.cooking {
            transition: filter 0.35s ease, transform 0.35s ease;
            cursor: pointer;
        }

        /* Hover: badge sharpens */
        .cooking-link:hover .cooking-badge {
            background: rgba(5, 5, 15, 0.97);
            color: #fff;
        }
        .cooking-link:hover .cooking-badge::after {
            content: ' →';
        }

        /* Working Out tile — same treatment as Cooking */
        .workout-link {
